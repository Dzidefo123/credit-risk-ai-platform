# LLM provider for document extraction and the copilot. Default: deterministic mock (no network, no key).
# Override per process with CRISK_LLM_PROVIDER=anthropic. The Anthropic backend needs `uv sync --group llm` and an
# API key in the environment (ANTHROPIC_API_KEY or `ant auth login`). Never put keys in this file or the repository.
provider: mock
mock:
  min_coverage: 0.5
anthropic:
  model: claude-sonnet-5-5  # chosen for cost (half the Opus 5.5 price); extraction and quoting are not reasoning-heavy
  effort: medium            # low | medium | high | xhigh | max (Sonnet 5.5 default is high; medium keeps cost down)
  max_tokens: 16000
  timeout_s: 120
  max_retries: 2
  fallbacks: default        # server-side refusal fallback; set to null to disable
