# FICTIONAL scenario variant of demo_policy 1.0.0: no model-based rules (attribute rules only; simulation only).
policy_id: demo_policy
version: "1.0.0-loose"
effective_from: "2026-10-13"
owner: credit-policy (fictional)
rules:
  - {id: E01, when: "credit_score < 620", outcome: decline, reason: "Credit score below programme minimum (620)"}
  - {id: E02, when: "orig_dti > 50", outcome: decline, reason: "Debt-to-income above programme maximum (50%)"}
  - {id: E03, when: "orig_ltv > 97", outcome: decline, reason: "Loan-to-value above programme maximum (97%)"}
  - {id: X01, when: "orig_upb > 800000", outcome: refer, reason: "Exposure above single-loan cap ($800k): senior approval"}
  - {id: D01, when: "score_status != 'scored'", outcome: refer, reason: "Model could not score the application"}
