# FICTIONAL demonstration credit policy. Not a real lender's policy and not a recommendation.
# Decisions: approve | refer (manual review) | decline. Precedence: decline > refer > approve.
# Risk rules use the model's RISK DECILE (rank) because the champion is approved for rank-ordering only;
# a rule on `pd` is refused unless the serving model is approved for 'pd_level'.
policy_id: demo_policy
version: "1.0.0"
effective_from: "2026-10-13"
owner: credit-policy (fictional)
rules:
  - {id: E01, when: "credit_score < 620", outcome: decline, reason: "Credit score below programme minimum (620)"}
  - {id: E02, when: "orig_dti > 50", outcome: decline, reason: "Debt-to-income above programme maximum (50%)"}
  - {id: E03, when: "orig_ltv > 97", outcome: decline, reason: "Loan-to-value above programme maximum (97%)"}
  - {id: E04, when: "occupancy_status == 'I' and orig_ltv > 85", outcome: decline,
     reason: "Investment property LTV above 85%"}
  - {id: X01, when: "orig_upb > 800000", outcome: refer, reason: "Exposure above single-loan cap ($800k): senior approval"}
  - {id: D01, when: "score_status != 'scored'", outcome: refer, reason: "Model could not score the application"}
  - {id: D02, when: "credit_score is None or orig_dti is None", outcome: refer,
     reason: "Key underwriting data missing (credit score or DTI)"}
  - {id: R01, when: "risk_decile == 10 and orig_dti > 45", outcome: decline,
     reason: "Highest model risk decile combined with DTI above 45%"}
  - {id: R02, when: "risk_decile >= 9", outcome: refer, reason: "Model risk decile 9-10: manual review"}
