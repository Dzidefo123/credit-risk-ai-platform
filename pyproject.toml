[project]
name = "credit-risk-ai-platform"
version = "0.1.0"
description = "Research/engineering prototype: origination-time mortgage PD modelling on Freddie Mac SFLLD with auditable scoring."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "lightgbm>=4.5",
]

[project.scripts]
crisk = "crisk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# The workspace sits in a cloud-synced folder on Windows where hardlinks fail (os error 396).
link-mode = "copy"

[tool.ruff.lint.per-file-ignores]
# Embedded SQL is easier to review unwrapped.
"src/crisk/quality/canonical.py" = ["E501"]
"src/crisk/labels/default_horizon.py" = ["E501"]
